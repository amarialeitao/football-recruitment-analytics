[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "football-recruitment-analytics"
version = "0.1.0"
description = "Player recruitment analytics for Liga Portugal and comparable European leagues, built on open data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maria Leitão" }]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "plotly>=5.24",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6"]
llm = ["anthropic>=0.40"]

[tool.hatch.build.targets.wheel]
packages = ["src/scouting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
