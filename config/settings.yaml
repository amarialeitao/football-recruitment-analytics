# Project settings. Every league, season and threshold used by the app lives here.

data:
  raw_dir: data/raw              # downloaded source files (git-ignored)
  processed_dir: data/processed  # filtered Parquet extracts (git-ignored)

sources:
  transfermarkt:
    url: "https://pub-e682421888d945d684bcae8890b0ec20.r2.dev/data/transfermarkt-datasets.duckdb"
    filename: transfermarkt-datasets.duckdb
    # Pin the checksum of the file you analysed so results are reproducible.
    # Leave empty to accept any version (the checksum is still recorded in the manifest).
    # Pinned 2026-10-22: dataset commit e44f186 (data current to 2026-07-06).
    sha256: "ba1eff7337b8ca78cb533df0b6eba0d6fc58218e0767460f6770e0b37f5a2113"
    license: "CC0 1.0"
    attribution: "transfermarkt-datasets (github.com/dcaribou/transfermarkt-datasets)"

scope:
  focus_competition: PO1
  competitions:
    PO1: Liga Portugal
    ES1: LaLiga
    BE1: Jupiler Pro League
    NL1: Eredivisie
    GR1: Super League 1
    TR1: Süper Lig
    DK1: Superliga
    SC1: Scottish Premiership
  # Season = calendar year in which the season starts (2025 = 2025/26).
  seasons: [2023, 2024, 2025]

analysis:
  # Minimum minutes in a season for a player to enter comparisons (percentiles, similarity, value).
  min_minutes: 900
  # Confidence badge by minutes played: < medium = low, medium..high = medium, >= high = high.
  confidence_minutes: {medium: 900, high: 1800}
  # Players up to this age (at 1 January of the season) are shown in the Potential page.
  young_age_max: 23
