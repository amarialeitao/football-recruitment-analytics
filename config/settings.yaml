# Project settings. Every league, season and threshold used by the app lives here.

data:
  raw_dir: data/raw              # downloaded source files (git-ignored)
  processed_dir: data/processed  # filtered Parquet extracts (git-ignored)

sources:
  transfermarkt:
    url: "https://pub-e682421888d945d684bcae8890b0ec20.r2.dev/data/transfermarkt-datasets.duckdb"
    filename: transfermarkt-datasets.duckdb
    # Pin the checksum of the file you analysed so results are reproducible.
    # Leave empty to accept any version (the checksum is still recorded in the manifest).
    # Pinned 2026-10-22: dataset commit e44f186 (data current to 2026-07-06).
    sha256: "ba1eff7337b8ca78cb533df0b6eba0d6fc58218e0767460f6770e0b37f5a2113"
    license: "CC0 1.0"
    attribution: "transfermarkt-datasets (github.com/dcaribou/transfermarkt-datasets)"
  # Prebuilt processed data for the hosted demo only (README > Live demo). Used only when the
  # SCOUTING_DEMO_DATA environment variable is set and no local data exists.
  demo_data:
    url: "https://github.com/amarialeitao/football-recruitment-analytics/releases/download/demo-data-v1/demo-data.zip"
    sha256: "0288ab563a8b7d284abd50479caedeaf9dbefeb54a69334e6cc66d0323915fbf"

scope:
  focus_competition: PO1
  competitions:
    PO1: Liga Portugal
    ES1: LaLiga
    BE1: Jupiler Pro League
    NL1: Eredivisie
    GR1: Super League 1
    TR1: Süper Lig
    DK1: Superliga
    SC1: Scottish Premiership
  # Season = calendar year in which the season starts (2025 = 2025/26).
  seasons: [2023, 2024, 2025]

analysis:
  # Minimum minutes in a season for a player to enter comparisons (percentiles, similarity, value).
  min_minutes: 900
  # Confidence badge by minutes played: < medium = low, medium..high = medium, >= high = high.
  confidence_minutes: {medium: 900, high: 1800}
  # Confidence badge for group-level insights by number of players compared.
  confidence_sample: {medium: 30, high: 100}
  # Players up to this age (at 1 January of the season) are shown in the Potential page.
  young_age_max: 23
  # Player Profile, change since last season: a percentile must move at least this many points
  # to read as "up" or "down"; smaller moves are shown as "about the same".
  trend_min_change: 10

quality:
  # Status board thresholds (OK / ATTENTION).
  completeness_min: 0.9          # share of filled key fields among players with minutes
  max_unreconciled_share: 0.01   # games whose goal events do not match the final score
  max_stale_value_share: 0.05    # regulars whose market value is over a year old
  max_data_age_days: 120         # days between the data cut-off and today

checks:
  # Plausibility bounds for the data checks run by scripts/build_dataset.py.
  # Breaking an age or market-value bound stops the build; height only produces a warning.
  age_range: [14, 45]
  height_cm_range: [150, 215]
  market_value_max: 300000000    # EUR; the most valuable player in scope is far below this

llm:
  # AI Scouting Notes (optional). Off by default: see README > AI Scouting Notes.
  # The model only receives the metrics computed for the selected player.
  enabled: false
  provider: anthropic
  model: claude-haiku-5-5
  api_key_env: ANTHROPIC_API_KEY   # name of the environment variable, never the key itself
  max_tokens: 600
